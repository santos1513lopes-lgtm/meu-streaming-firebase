<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - Meu Streaming</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231ed760'%3E%3Cpath d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/%3E%3C/svg%3E">

    <style>
        body {
            background-color: #121212; color: white;
            font-family: 'Segoe UI', sans-serif; padding: 20px;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .container {
            background-color: #181818; padding: 30px; border-radius: 10px;
            width: 100%; max-width: 400px; text-align: center; border: 1px solid #333;
        }
        h1 { color: #1ed760; margin-bottom: 20px; }
        
        input, select {
            width: 90%; padding: 12px; margin-bottom: 15px;
            background-color: #333; border: none; color: white; border-radius: 5px;
        }
        
        button {
            width: 100%; padding: 12px; background-color: #1ed760; color: black;
            font-weight: bold; border: none; border-radius: 25px; cursor: pointer; font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background-color: #1db954; }
        button:disabled { background-color: #555; cursor: not-allowed; color: #aaa; }
        
        .voltar { display: block; margin-top: 15px; color: #b3b3b3; text-decoration: none; font-size: 0.9em; }

        /* --- ESTILO DA BARRA DE PROGRESSO --- */
        #progress-container {
            width: 100%;
            background-color: #333;
            border-radius: 10px;
            margin-top: 15px;
            display: none; /* Começa escondido */
            overflow: hidden;
        }
        
        #progress-bar {
            width: 0%;
            height: 10px;
            background-color: #1ed760; /* Verde Spotify */
            transition: width 0.2s;
        }

        #status-text {
            display: block; margin-top: 5px; font-size: 0.9em; color: #1ed760; min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📤 Enviar Música</h1>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <label style="display:block; text-align:left; margin-bottom:5px;">Arquivo MP3:</label>
            <input type="file" name="arquivo" accept=".mp3" required>
            
            <label style="display:block; text-align:left; margin-bottom:5px;">Nome da Playlist:</label>
            <input type="text" name="playlist" list="sugestoes" value="GERAL" placeholder="Escolha ou digite uma nova..." required>
            
            <datalist id="sugestoes">
                {% for nome in sugestoes %}
                <option value="{{ nome }}">
                {% endfor %}
            </datalist>
            
            <button type="submit" id="btn-enviar">🚀 Enviar para o Site</button>
        </form>

        <div id="progress-wrapper" style="display: none;">
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <span id="status-text">0%</span>
        </div>

        <a href="/" class="voltar">← Voltar para o Streaming</a>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const btnEnviar = document.getElementById('btn-enviar');
        const progressWrapper = document.getElementById('progress-wrapper');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Impede o envio padrão (para a gente controlar)

            // 1. Prepara os dados
            const formData = new FormData(form);
            const xhr = new XMLHttpRequest();

            // 2. Mostra a barra e bloqueia o botão
            progressWrapper.style.display = 'block';
            btnEnviar.disabled = true;
            btnEnviar.innerText = "Enviando... Aguarde ⏳";

            // 3. Monitora o progresso (A Mágica acontece aqui)
            xhr.upload.onprogress = function(event) {
                if (event.lengthComputable) {
                    const percentComplete = (event.loaded / event.total) * 100;
                    const percentString = Math.round(percentComplete) + '%';
                    
                    progressBar.style.width = percentString;
                    statusText.innerText = percentString;
                    
                    if (percentComplete >= 100) {
                        statusText.innerText = "Processando no servidor... (Quase lá!)";
                    }
                }
            };

            // 4. Quando terminar tudo
            xhr.onload = function() {
                if (xhr.status === 200) {
                    statusText.innerText = "Concluído! Redirecionando...";
                    setTimeout(() => {
                        window.location.href = "/"; // Volta para a Home
                    }, 1000);
                } else {
                    statusText.innerText = "❌ Erro ao enviar. Tente novamente.";
                    statusText.style.color = "red";
                    btnEnviar.disabled = false;
                }
            };

            // 5. Envia a requisição
            xhr.open('POST', '/upload', true);
            xhr.send(formData);
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Streaming Premium</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231ed760'%3E%3Cpath d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/%3E%3C/svg%3E">

    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #181818;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 350px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #1ed760; margin-bottom: 30px; }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #333;
            border: none;
            color: white;
            border-radius: 5px;
            outline: none;
        }
        input:focus { border: 1px solid #1ed760; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1ed760;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background-color: #1db954; }
        .erro { color: #ff5555; margin-bottom: 15px; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>🔒 Acesso Restrito</h1>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="erro">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>

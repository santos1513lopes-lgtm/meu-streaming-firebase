<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Streaming Pro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231ed760'%3E%3Cpath d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/%3E%3C/svg%3E">

    <style>
        body {
            background-color: #121212; color: white;
            font-family: 'Segoe UI', sans-serif; padding: 20px; padding-bottom: 80px;
        }
        .container { max-width: 800px; margin: 0 auto; position: relative; }
        h1 { text-align: center; color: #1ed760; margin-bottom: 20px; }

        /* Botão de Upload no topo */
        .btn-upload {
            position: absolute; top: 0; right: 0;
            background-color: #333; color: white; padding: 8px 15px;
            text-decoration: none; border-radius: 20px; font-size: 0.9em; border: 1px solid #555;
        }
        .btn-upload:hover { background-color: #555; }

        /* Barra de Pesquisa */
        .search-box {
            width: 100%; padding: 15px; font-size: 16px;
            border-radius: 30px; border: none; margin-bottom: 30px;
            background-color: #333; color: white; text-align: center; outline: none;
        }
        .search-box:focus { border: 2px solid #1ed760; background-color: #444; }

        /* Títulos das Playlists */
        .titulo-playlist {
            color: #fff; border-bottom: 1px solid #333;
            padding-bottom: 5px; margin-top: 40px;
            font-size: 1.5em; text-transform: uppercase; letter-spacing: 2px;
        }

        /* Cartão da Música */
        .cartao-musica {
            background-color: #181818; padding: 15px; margin-bottom: 10px;
            border-radius: 6px; display: flex; flex-direction: column; transition: background 0.2s;
            position: relative; cursor: pointer;
        }
        .cartao-musica:hover { background-color: #252525; }
        .cartao-musica.tocando { border-left: 4px solid #1ed760; background-color: #2a2a2a; }
        
        .nome { font-weight: bold; font-size: 1.1em; color: #e1e1e1; padding-right: 30px; pointer-events: none; }
        
        /* Formulário de Mover */
        .form-playlist { margin-top: 10px; display: flex; gap: 5px; }
        input[list] {
            background: #333; border: none; color: white; padding: 8px; 
            border-radius: 4px; flex-grow: 1; cursor: pointer;
        }
        button { background: #1ed760; color: black; border: none; font-weight: bold; padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        
        /* Player de Áudio */
        audio { width: 100%; margin-top: 10px; height: 30px; }

        /* Botão de Deletar (Lixeira) */
        .btn-deletar {
            background: none; border: none; font-size: 1.2em; cursor: pointer;
            position: absolute; top: 10px; right: 10px; opacity: 0.5; transition: 0.3s;
            padding: 0; margin: 0; width: auto; color: inherit; z-index: 10;
        }
        .btn-deletar:hover { opacity: 1; transform: scale(1.1); color: #ff5555; }
        
        /* Ocultar títulos de playlists vazias na busca */
        .secao-playlist.escondido { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <a href="/upload" class="btn-upload">📤 Upload</a>
        
        <h1>🎵 Streaming Premium</h1>
        
        <input type="text" id="searchInput" list="lista-playlists" class="search-box" placeholder="🔍 Pesquisar música ou playlist... (Enter para tocar)">

        <datalist id="lista-playlists">
            {% for opcao in lista_opcoes %}
                <option value="{{ opcao }}">
            {% endfor %}
        </datalist>

        {% for nome_playlist, musicas in playlists.items() %}
            <div class="secao-playlist">
                <h2 class="titulo-playlist">{{ nome_playlist }}</h2>
                
                {% for musica in musicas %}
                <div class="cartao-musica" data-nome="{{ musica.nome }}" data-playlist="{{ nome_playlist }}">
                    
                    <span class="nome">{{ musica.nome }}</span>

                    <form action="/deletar" method="POST" onsubmit="return confirm('Tem certeza que deseja EXCLUIR essa música?');">
                        <input type="hidden" name="id_musica" value="{{ musica.nome }}">
                        <button type="submit" class="btn-deletar" title="Excluir Música">🗑️</button>
                    </form>

                    <audio controls src="{{ musica.url }}"></audio>
                    
                    <form class="form-playlist" action="/atualizar" method="POST">
                        <input type="hidden" name="id_musica" value="{{ musica.id }}">
                        <input type="text" list="lista-playlists" name="nova_playlist" placeholder="Mover para..." required>
                        <button type="submit">Mover</button>
                    </form>
                </div>
                {% endfor %}
            </div>
        {% endfor %}
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const cartoes = document.querySelectorAll('.cartao-musica');
        const secoes = document.querySelectorAll('.secao-playlist');
        const todosAudios = document.querySelectorAll('audio');

        // --- 1. Lógica de Pesquisa (Híbrida: Música + Playlist) ---
        function filtrarMusicas() {
            const termo = searchInput.value.toLowerCase();
            
            secoes.forEach(secao => {
                let temMusicaVisivel = false;
                const musicasNaSecao = secao.querySelectorAll('.cartao-musica');
                
                musicasNaSecao.forEach(cartao => {
                    const nomeMusica = cartao.getAttribute('data-nome').toLowerCase();
                    const nomePlaylist = cartao.getAttribute('data-playlist').toLowerCase();
                    
                    if (nomeMusica.includes(termo) || nomePlaylist.includes(termo)) {
                        cartao.style.display = 'flex';
                        cartao.classList.add('visivel-na-busca');
                        temMusicaVisivel = true;
                    } else {
                        cartao.style.display = 'none';
                        cartao.classList.remove('visivel-na-busca');
                    }
                });

                // Esconde o título da playlist se não houver músicas visíveis nela
                secao.style.display = temMusicaVisivel ? 'block' : 'none';
            });
        }
        searchInput.addEventListener('input', filtrarMusicas);

        // --- 2. Enter para Tocar (Acessibilidade) ---
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const primeiraVisivel = document.querySelector('.cartao-musica.visivel-na-busca') || document.querySelector('.cartao-musica');
                if (primeiraVisivel && primeiraVisivel.style.display !== 'none') {
                    const audio = primeiraVisivel.querySelector('audio');
                    if(audio) { audio.play(); searchInput.blur(); }
                }
            }
        });

        // --- 3. Click no Cartão para Tocar ---
        cartoes.forEach(cartao => {
            cartao.classList.add('visivel-na-busca');
            cartao.addEventListener('click', function(e) {
                // Evita tocar se clicou nos botões ou inputs
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('form')) return;
                
                const audio = this.querySelector('audio');
                if (audio) { audio.paused ? audio.play() : audio.pause(); }
            });
        });

        // --- 4. SISTEMA DE ÁUDIO INTELIGENTE (Media Session API) ---
        todosAudios.forEach(audio => {
            
            // Quando der Play...
            audio.addEventListener('play', function() {
                // Pausa os outros
                todosAudios.forEach(outro => { 
                    if (outro !== audio) { 
                        outro.pause(); 
                        outro.closest('.cartao-musica').classList.remove('tocando'); 
                    } 
                });
                
                const cartaoAtual = this.closest('.cartao-musica');
                cartaoAtual.classList.add('tocando');

                // --- CONFIGURAÇÃO DA TELA DE BLOQUEIO / SEGUNDO PLANO ---
                if ('mediaSession' in navigator) {
                    const nomeMusica = cartaoAtual.getAttribute('data-nome');
                    const nomePlaylist = cartaoAtual.getAttribute('data-playlist');

                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: nomeMusica,
                        artist: nomePlaylist,
                        artwork: [
                            { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231ed760'%3E%3Cpath d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/%3E%3C/svg%3E", sizes: "96x96", type: "image/svg+xml" }
                        ]
                    });

                    // Botões da Tela de Bloqueio
                    navigator.mediaSession.setActionHandler('play', () => audio.play());
                    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                    
                    navigator.mediaSession.setActionHandler('previoustrack', () => {
                        let anterior = cartaoAtual.previousElementSibling;
                        if (anterior && anterior.classList.contains('cartao-musica')) {
                            let audioAnt = anterior.querySelector('audio');
                            if(audioAnt) audioAnt.play();
                        }
                    });

                    navigator.mediaSession.setActionHandler('nexttrack', () => {
                        let proximo = cartaoAtual.nextElementSibling;
                        if (proximo && proximo.classList.contains('cartao-musica')) {
                            let audioProx = proximo.querySelector('audio');
                            if(audioProx) audioProx.play();
                        }
                    });
                }
            });

            // Autoplay (Toca a próxima quando acabar)
            audio.addEventListener('ended', function() {
                let proximo = this.closest('.cartao-musica').nextElementSibling;
                if (proximo && proximo.classList.contains('cartao-musica')) {
                    let audioProx = proximo.querySelector('audio');
                    if (audioProx) audioProx.play();
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Streaming Pro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231ed760'%3E%3Cpath d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/%3E%3C/svg%3E">

    <style>
        body {
            background-color: #121212; color: white;
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0;
            padding-bottom: 80px;
        }
        
        .container { max-width: 800px; margin: 0 auto; position: relative; padding: 20px; }

        /* HEADER FIXO */
        .sticky-header {
            position: sticky; top: 0; z-index: 1000;
            background-color: #121212; padding-top: 15px; padding-bottom: 15px;
            border-bottom: 1px solid #333; margin-bottom: 20px;
        }

        h1 { text-align: center; color: #1ed760; margin: 0 0 15px 0; font-size: 1.8em; }

        .botoes-topo {
            display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .btn-acao {
            background-color: #333; color: white; padding: 8px 15px;
            text-decoration: none; border-radius: 20px; font-size: 0.9em; border: 1px solid #555;
            transition: 0.2s; cursor: pointer; display: inline-block;
        }
        .btn-acao:hover { background-color: #555; transform: scale(1.05); }
        .btn-sair { background-color: #3f1010; border-color: #5c1818; }
        .btn-sair:hover { background-color: #5c1818; }
        .btn-loop.ativo { background-color: #1ed760; color: black; font-weight: bold; border-color: #1ed760; }

        .search-box {
            width: 100%; padding: 12px; font-size: 16px; border-radius: 30px; border: none;
            background-color: #2a2a2a; color: white; text-align: center; outline: none; border: 1px solid #333;
        }
        .search-box:focus { border: 2px solid #1ed760; background-color: #333; }

        /* --- PLAYLIST ESTILIZADA --- */
        .secao-playlist {
            margin-bottom: 15px; border: 1px solid #333; border-radius: 8px;
            overflow: hidden; background-color: #181818;
        }
        
        .cabecalho-playlist {
            background-color: #222; padding: 10px 15px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            user-select: none; transition: background 0.2s;
        }
        .cabecalho-playlist:hover { background-color: #2a2a2a; }

        .titulo-container { display: flex; align-items: center; gap: 10px; flex-grow: 1; }
        .titulo-playlist { color: #fff; margin: 0; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px; }

        /* BOTÕES DE GESTÃO DA PLAYLIST (Editar/Excluir) */
        .acoes-playlist { display: flex; gap: 5px; opacity: 0.6; transition: 0.3s; margin-right: 15px; }
        .cabecalho-playlist:hover .acoes-playlist { opacity: 1; }
        
        .btn-icon {
            background: none; border: none; font-size: 1.1em; cursor: pointer; padding: 5px; color: #fff;
        }
        .btn-icon:hover { transform: scale(1.2); }
        .btn-edit:hover { color: #1ed760; }
        .btn-trash:hover { color: #ff5555; }

        .seta-icon { transition: transform 0.3s ease; color: #1ed760; font-size: 1.2em; }
        .aberto .seta-icon { transform: rotate(180deg); }

        .lista-musicas { display: none; padding: 10px; background-color: #121212; border-top: 1px solid #333; }
        .lista-musicas.mostrar { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- CARTÃO DE MÚSICA --- */
        .cartao-musica {
            background-color: #1e1e1e; padding: 12px; margin-bottom: 8px;
            border-radius: 6px; display: flex; flex-direction: column; transition: background 0.2s;
            position: relative; cursor: pointer; border: 1px solid #2a2a2a;
        }
        .cartao-musica:hover { background-color: #282828; }
        .cartao-musica.tocando { border-left: 4px solid #1ed760; background-color: #252525; }
        .nome { font-weight: bold; font-size: 1em; color: #e1e1e1; padding-right: 30px; pointer-events: none; margin-bottom: 5px; }
        .form-playlist { margin-top: 8px; display: flex; gap: 5px; }
        input[list] { background: #333; border: none; color: white; padding: 6px; border-radius: 4px; flex-grow: 1; cursor: pointer; font-size: 0.9em; }
        button { background: #1ed760; color: black; border: none; font-weight: bold; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.9em; }
        audio { width: 100%; margin-top: 5px; height: 25px; }
        .btn-deletar {
            background: none; border: none; font-size: 1.1em; cursor: pointer;
            position: absolute; top: 10px; right: 10px; opacity: 0.5; transition: 0.3s; color: inherit; z-index: 10;
        }
        .btn-deletar:hover { opacity: 1; transform: scale(1.1); color: #ff5555; }
        #btn-topo {
            position: fixed; bottom: 20px; right: 20px; background-color: #1ed760; color: black; border: none;
            border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; display: none; z-index: 2000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sticky-header">
            <div class="botoes-topo">
                <button id="btn-loop" class="btn-acao btn-loop" onclick="alternarLoop()">🔁 Loop: OFF</button>
                <a href="/upload" class="btn-acao">📤 Upload</a>
                <a href="/logout" class="btn-acao btn-sair">🚪 Sair</a>
            </div>
            <h1>🎵 Streaming Premium</h1>
            <input type="text" id="searchInput" list="lista-playlists" class="search-box" placeholder="🔍 Pesquisar música ou playlist...">
        </div>

        <datalist id="lista-playlists">
            {% for opcao in lista_opcoes %}
                <option value="{{ opcao }}">
            {% endfor %}
        </datalist>

        {% for nome_playlist, musicas in playlists.items() %}
            <div class="secao-playlist">
                <div class="cabecalho-playlist" onclick="alternarPlaylist(this)">
                    
                    <div class="titulo-container">
                        <h2 class="titulo-playlist">{{ nome_playlist }}</h2>
                    </div>

                    <div class="acoes-playlist" onclick="event.stopPropagation();">
                        <button class="btn-icon btn-edit" onclick="abrirRenomear('{{ nome_playlist }}')" title="Renomear Playlist">✏️</button>
                        
                        <form action="/deletar_playlist" method="POST" style="display:inline;" onsubmit="return confirm('⚠️ PERIGO: Isso vai apagar TODAS as músicas da playlist {{ nome_playlist }}! Tem certeza?');">
                            <input type="hidden" name="nome_playlist" value="{{ nome_playlist }}">
                            <button type="submit" class="btn-icon btn-trash" title="Apagar Playlist Inteira">🗑️</button>
                        </form>
                    </div>

                    <span class="seta-icon">▼</span>
                </div>

                <div class="lista-musicas">
                    {% for musica in musicas %}
                    <div class="cartao-musica" data-nome="{{ musica.nome }}" data-playlist="{{ nome_playlist }}">
                        <span class="nome">{{ musica.nome }}</span>
                        <form action="/deletar" method="POST" onsubmit="return confirm('Excluir essa música?');">
                            <input type="hidden" name="id_musica" value="{{ musica.nome }}">
                            <button type="submit" class="btn-deletar" title="Excluir">🗑️</button>
                        </form>
                        <audio controls src="{{ musica.url }}"></audio>
                        <form class="form-playlist" action="/atualizar" method="POST">
                            <input type="hidden" name="id_musica" value="{{ musica.id }}">
                            <input type="text" list="lista-playlists" name="nova_playlist" placeholder="Mover..." required>
                            <button type="submit">Mover</button>
                        </form>
                    </div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </div>

    <form id="formRenomear" action="/renomear_playlist" method="POST" style="display:none;">
        <input type="hidden" name="nome_antigo" id="inputNomeAntigo">
        <input type="hidden" name="nome_novo" id="inputNomeNovo">
    </form>

    <button id="btn-topo" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">⬆</button>

    <script>
        const searchInput = document.getElementById('searchInput');
        const secoes = document.querySelectorAll('.secao-playlist');
        const todosAudios = document.querySelectorAll('audio');
        const btnTopo = document.getElementById('btn-topo');
        const btnLoop = document.getElementById('btn-loop');
        let loopAtivo = false;

        // --- FUNÇÃO PARA RENOMEAR ---
        function abrirRenomear(nomeAtual) {
            const novoNome = prompt("Digite o novo nome para a playlist:", nomeAtual);
            if (novoNome && novoNome !== nomeAtual) {
                document.getElementById('inputNomeAntigo').value = nomeAtual;
                document.getElementById('inputNomeNovo').value = novoNome;
                document.getElementById('formRenomear').submit();
            }
        }

        function alternarLoop() {
            loopAtivo = !loopAtivo;
            btnLoop.innerText = loopAtivo ? "🔁 Loop: ON" : "🔁 Loop: OFF";
            btnLoop.classList.toggle('ativo', loopAtivo);
        }

        function alternarPlaylist(header) {
            header.classList.toggle('aberto');
            const lista = header.nextElementSibling;
            lista.classList.toggle('mostrar');
        }

        function filtrarMusicas() {
            const termo = searchInput.value.toLowerCase();
            secoes.forEach(secao => {
                let temMusicaVisivel = false;
                const musicasNaSecao = secao.querySelectorAll('.cartao-musica');
                const header = secao.querySelector('.cabecalho-playlist');
                const lista = secao.querySelector('.lista-musicas');
                const nomeDaPlaylist = secao.querySelector('.titulo-playlist').innerText.toLowerCase();
                
                // Agora o nome da playlist também filtra
                const playlistCombina = nomeDaPlaylist.includes(termo);

                musicasNaSecao.forEach(cartao => {
                    const nomeMusica = cartao.getAttribute('data-nome').toLowerCase();
                    const nomePlaylistTag = cartao.getAttribute('data-playlist').toLowerCase();
                    if (nomeMusica.includes(termo) || nomePlaylistTag.includes(termo) || playlistCombina) {
                        cartao.style.display = 'flex'; cartao.classList.add('visivel-na-busca'); temMusicaVisivel = true;
                    } else {
                        cartao.style.display = 'none'; cartao.classList.remove('visivel-na-busca');
                    }
                });

                if (temMusicaVisivel) {
                    secao.style.display = 'block';
                    if (termo.length > 0) { lista.classList.add('mostrar'); header.classList.add('aberto'); }
                } else { secao.style.display = 'none'; }
                
                if (termo.length === 0) { lista.classList.remove('mostrar'); header.classList.remove('aberto'); secao.style.display = 'block'; }
            });
        }
        searchInput.addEventListener('input', filtrarMusicas);

        window.onscroll = function() {
            btnTopo.style.display = (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) ? "block" : "none";
        };

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const primeiraVisivel = document.querySelector('.cartao-musica.visivel-na-busca') || document.querySelector('.lista-musicas.mostrar .cartao-musica');
                if (primeiraVisivel && primeiraVisivel.style.display !== 'none') {
                    const audio = primeiraVisivel.querySelector('audio');
                    if(audio) { audio.play(); searchInput.blur(); }
                }
            }
        });

        const cartoes = document.querySelectorAll('.cartao-musica');
        cartoes.forEach(cartao => {
            cartao.classList.add('visivel-na-busca');
            cartao.addEventListener('click', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('form') || e.target.closest('.acoes-playlist')) return;
                const audio = this.querySelector('audio');
                if (audio) { audio.paused ? audio.play() : audio.pause(); }
            });
        });

        todosAudios.forEach(audio => {
            audio.addEventListener('play', function() {
                todosAudios.forEach(outro => { if (outro !== audio) { outro.pause(); outro.closest('.cartao-musica').classList.remove('tocando'); } });
                const cartaoAtual = this.closest('.cartao-musica');
                cartaoAtual.classList.add('tocando');
                
                if ('mediaSession' in navigator) {
                    const nomeMusica = cartaoAtual.getAttribute('data-nome');
                    const nomePlaylist = cartaoAtual.getAttribute('data-playlist');
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: nomeMusica, artist: nomePlaylist,
                        artwork: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231ed760'%3E%3Cpath d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/%3E%3C/svg%3E", sizes: "96x96", type: "image/svg+xml" }]
                    });
                    navigator.mediaSession.setActionHandler('play', () => audio.play());
                    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                    navigator.mediaSession.setActionHandler('previoustrack', () => {
                        let anterior = cartaoAtual.previousElementSibling;
                        if (anterior && anterior.classList.contains('cartao-musica')) { let audioAnt = anterior.querySelector('audio'); if(audioAnt) audioAnt.play(); }
                    });
                    navigator.mediaSession.setActionHandler('nexttrack', () => {
                        let proximo = cartaoAtual.nextElementSibling;
                        if (proximo && proximo.classList.contains('cartao-musica')) { let audioProx = proximo.querySelector('audio'); if(audioProx) audioProx.play(); }
                    });
                }
            });

            audio.addEventListener('ended', function() {
                let cartaoAtual = this.closest('.cartao-musica');
                let proximo = cartaoAtual.nextElementSibling;
                if (proximo && proximo.classList.contains('cartao-musica')) {
                    let audioProx = proximo.querySelector('audio');
                    if (audioProx) audioProx.play();
                } else if (loopAtivo) {
                    let playlistContainer = cartaoAtual.closest('.lista-musicas');
                    let primeiraMusica = playlistContainer.querySelector('.cartao-musica');
                    if(primeiraMusica) {
                        let audioPrimeira = primeiraMusica.querySelector('audio');
                        if(audioPrimeira) audioPrimeira.play();
                    }
                }
            });
        });
    </script>
</body>
</html>
